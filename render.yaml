# Render blueprint for the FixItBharat API.
#
# Region is Ohio (us-east-2) on purpose: the Neon database lives there, and every
# query currently crosses an ocean from Prayagraj.
#
# No disk is needed: photo bytes are stored in Postgres (report_images), so the
# free plan works and nothing is lost when the instance restarts.

services:
  - type: web
    name: fixitbharat-api
    runtime: python
    region: ohio
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0

      # Set these in the dashboard. `sync: false` means Render prompts for the
      # value instead of storing it in this file.
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: NOMINATIM_CONTACT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ROUTING_TEST_RECIPIENT
        sync: false
      - key: DEPARTMENT_KEY
        sync: false

      # The deployed frontend. Replace with your Vercel domain.
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app,http://localhost:5174
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
